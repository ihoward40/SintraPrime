authorities:
  - authority_id: "AUTH-666234-001"
    authority_reference: "15 U.S.C. § 1692g — Fair Debt Collection Practices Act (FDCPA), Validation of Debts"
    authority_type: federal_statute
    jurisdiction: federal
    supports_fact_ids:
      - "FACT-666234-001"
      - "FACT-666234-003"
    supports_analysis_ids:
      - "LA-666234-001"
      - "LA-666234-002"
      - "LA-666234-004"
    applicability_status: Applicable
    quoted: true
    quoted_text: >
      "If the consumer notifies the debt collector in writing within the thirty-day period
      described in subsection (a) that the debt, or any portion thereof, is disputed, or
      that the consumer requests the name and address of the original creditor, the debt
      collector shall cease collection of the debt, or any disputed portion thereof, until
      the debt collector obtains verification of the debt or a copy of a judgment, or the
      name and address of the original creditor, and a copy of such verification or judgment,
      or name and address of the original creditor, is mailed to the consumer by the debt
      collector."
    notes: "Core validation right. Consumer must exercise in writing within 30-day window."

  - authority_id: "AUTH-666234-002"
    authority_reference: "15 U.S.C. § 1681s-2(b) — Fair Credit Reporting Act (FCRA), Duties of Furnishers"
    authority_type: federal_statute
    jurisdiction: federal
    supports_fact_ids:
