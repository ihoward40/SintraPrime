    supports_analysis_ids:
      - "LA-666234-001"
      - "LA-666234-003"
    applicability_status: Conditionally_Applicable
    quoted: true
    quoted_text: >
      "After receiving notice pursuant to section 1681i(a)(2) of this title of a dispute
      with regard to the completeness or accuracy of any information provided by a person
      to a consumer reporting agency, the person shall investigate the dispute..."
    notes: >
      Applicable if LVNV is confirmed as furnisher and CRA dispute is filed.
      Condition: credit report pull (EV-666234-002) required first.

